name: Deploy blog admin

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blog-admin-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine release version
        run: |
          set -Eeuo pipefail
          git fetch origin --tags
          RELEASE_TAG="$(bash scripts/release-version.sh "$GITHUB_SHA")"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "Release version: $RELEASE_TAG"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: blogtry/package-lock.json

      - name: Install dependencies
        working-directory: blogtry
        run: npm ci

      - name: Run session regression tests
        working-directory: blogtry
        run: npm test

      - name: Build admin frontend
        working-directory: blogtry
        run: npm run build

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.ALIYUN_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.ALIYUN_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          : "${SSH_KEY:?请配置 ALIYUN_SSH_KEY}"
          : "${KNOWN_HOSTS:?请配置 ALIYUN_KNOWN_HOSTS}"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Upload admin frontend
        env:
          ALIYUN_HOST: ${{ secrets.ALIYUN_HOST }}
          ALIYUN_USER: ${{ secrets.ALIYUN_USER }}
          DEPLOY_PATH: /www/wwwroot/blogtry
        run: |
          set -Eeuo pipefail
          : "${ALIYUN_HOST:?请配置 ALIYUN_HOST}"
          : "${ALIYUN_USER:?请配置 ALIYUN_USER}"

          rsync -az --delete \
            --exclude='.well-known/' \
            --exclude='.user.ini' \
            blogtry/dist/ \
            "$ALIYUN_USER@$ALIYUN_HOST:$DEPLOY_PATH/"

      - name: Check admin website
        run: |
          curl --fail --silent --show-error \
            --max-time 15 \
            https://admin.xiaoyangxiaozhang.xyz/ \
            >/dev/null

      - name: Tag deployed release
        run: |
          set -Eeuo pipefail
          git fetch origin --tags
          if git show-ref --tags --verify --quiet "refs/tags/$RELEASE_TAG"; then
            if [[ "$(git rev-list -n 1 "$RELEASE_TAG")" == "$GITHUB_SHA" ]]; then
              echo "Reusing deployed release tag: $RELEASE_TAG"
              exit 0
            fi
            echo "Tag already belongs to another commit: $RELEASE_TAG" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "$RELEASE_TAG" "$GITHUB_SHA" --message "Deploy $RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"
          echo "Created release tag: $RELEASE_TAG"
